<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; width: 300px; background: #111a2b; color: #e5e7eb; font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; padding: 14px 16px; }
        h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
        h1 img { width: 20px; height: 20px; }
        .state { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; flex: none; }
        .dot.ok { background: #22c55e; } .dot.bad { background: #ef4444; } .dot.off { background: #d97706; }
        .muted { color: #9aa4b2; font-size: 12px; }
        .stats { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <h1><img src="icons/32.png" alt=""><span id="name"></span></h1>
    <div class="state"><span class="dot" id="dot"></span><span id="stateText"></span></div>
    <div class="stats muted" id="stats"></div>
    <script src="popup.js"></script>
</body>
</html>
